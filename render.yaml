services:
  - type: web
    name: code-review-api
    runtime: node
    plan: free
    rootDir: BackEnd
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: http://localhost:5173
      - key: GOOGLE_GEMINI_KEY
        sync: false
